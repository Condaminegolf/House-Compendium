{id:'yard-tidy',icon:'🌱',name:'Keep outdoor areas clear',desc:'Remove light litter and keep paths clear where safe. Do not lift heavy objects or handle chemicals.',freq:14,who:'resident'},
{id:'ac-filter',icon:'❄️',name:'Check accessible air-conditioner filters',desc:'Only clean removable filters according to the model manual, if safely reachable.',freq:30,who:'resident'},
{id:'drains',icon:'🌧️',name:'Visually check drains from ground level',desc:'Look for leaves, pooling water and obstructions; report blocked drains. No roof or ladder work.',freq:30,who:'resident'},
{id:'walls',icon:'🏡',name:'Look for pests, mould or water damage',desc:'Report new damp spots, unusual smells, pests or visible deterioration.',freq:30,who:'resident'},

const tabs=()=>s.role==='tech'?[['tech','🛠️','Jobs'],['properties','🏡','Properties'],['library','🎞️','Guides'],['routinesAdmin','🌱','Routine care']]:[['home','🏠',t('home')],['fix','🔧',t('fix')],['care','✅',t('care')],['tickets','🎫',t('requests')]];
const btnNav=()=>tabs().map(([id,icon,label])=>`<button class="${s.view===id?'active':''}" onclick="go('${id}')"><span>${icon}</span>${safe(label)}</button>`).join('');
function header(){return `<header class="top"><div class="top-inner"><div class="brand"><div class="brandmark">⌂</div><div><strong>Property Care</strong><small>${s.house?safe(houseName(s.house)):'House & yard companion'}</small></div></div><div class="top-actions"><button class="smallbtn changehouse" onclick="changeHouse()">⌂ ${safe(t('change'))}</button><select aria-label="Language" onchange="setLang(this.value)">${langs.map(([v,l])=>`<option value="${v}" ${s.language===v?'selected':''}>${safe(l)}</option>`).join('')}</select><button title="Toggle demonstration staff role" class="smallbtn ${s.role==='tech'?'active':''}" onclick="toggleRole()">${s.role==='tech'?'🔧 Staff':'⚙️'}</button></div></div></header>`}
function nav(){return `<nav class="nav">${tabs().map(([id,icon,label])=>`<button onclick="go('${id}')" class="${s.view===id?'active':''}">${icon} ${safe(label)}</button>`).join('')}</nav>`}
function gate(){return `<div class="gate-wrap"><div class="gate"><span class="tag">🏡 30 property profiles</span><h1>${safe(t('welcome'))}</h1><p class="lead">Choose your address. Your house's equipment and relevant guides will appear automatically.</p><div class="field"><label>${safe(t('house'))}</label><select id="house-picker"><option value="">Choose an address…</option>${houses.map(h=>`<option value="${safe(h.id)}" ${pendingHouse===h.id?'selected':''}>${safe(houseName(h.id))}${h.address?'':' (placeholder)'}</option>`).join('')}</select></div><div class="field"><label>${safe(t('language'))}</label><select onchange="setLang(this.value)">${langs.map(([v,l])=>`<option value="${v}" ${s.language===v?'selected':''}>${safe(l)}</option>`).join('')}</select></div><div class="info">Property addresses can be imported or edited by the maintenance administrator. A QR sticker could select each property in the live app.</div><button class="primary" onclick="setup()">${safe(t('continue'))} →</button><p class="small muted">Prototype: address selection is not an identity check.</p></div></div>`}
function home(){let open=s.tickets.filter(x=>x.house===s.house&&x.status!=='Resolved').length;const h=houseRec(s.house)||{};let eq=s.equipment.filter(x=>x.propertyId===s.house);return `<section class="hero"><div><div class="eyebrow">${safe(houseName(s.house))} • Home & yard</div><h1>${safe(t('today'))}</h1><p>${safe(t('subtitle'))}</p></div><div class="hero-icon">🏡</div></section>${localizeNotice()}<div class="section-head"><h2>What would you like to do?</h2></div><div class="grid"><button class="tile" onclick="go('fix')"><span class="tile-emoji">🔧</span><strong>${safe(t('issue'))}</strong><span>${safe(t('issueSub'))}</span><span class="arrow">Troubleshoot →</span></button><button class="tile" onclick="go('care')"><span class="tile-emoji">🌱</span><strong>${safe(t('care'))}</strong><span>${safe(t('careSub'))}</span><span class="arrow">View checklist →</span></button><button class="tile" onclick="go('tickets')"><span class="tile-emoji">🎫</span><strong>${safe(t('requests'))}${open?' ('+open+')':''}</strong><span>${safe(t('requestSub'))}</span><span class="arrow">My requests →</span></button></div><div class="section-head"><h2>Your house & equipment</h2><button class="smallbtn" onclick="changeHouse()">↔ Change address</button></div><div class="panel"><div class="kv"><b>Water supply</b><span>${safe(h.water_supply||'Not configured')}</span></div><div class="kv"><b>Site</b><span>${safe(h.site||'Not configured')}</span></div><div class="kv"><b>Emergency contact</b><span>${safe(h.emergency_contact_name||'Not configured')}${h.emergency_contact_number?' • <a href="tel:'+safe(h.emergency_contact_number.replace(/[^+0-9]/g,''))+'">'+safe(h.emergency_contact_number)+'</a>':''}</span></div>${h.approved_guide_notes?`<p class="muted small">${safe(h.approved_guide_notes)}</p>`:''}<h3 class="subhead">House reference photos & videos</h3>${mediaGallery('property:'+s.house)}${eq.length?`<h3 class="subhead">Equipment (${eq.length})</h3>${eq.map(x=>`<div class="steps-card"><strong>${safe(x.name)}</strong><p class="muted small">${safe(x.location)}${x.model?' • '+safe(x.model):''}</p><p>${safe(x.notes)}</p>${mediaGallery('equipment:'+x.id)}</div>`).join('')}`:`<p class="small muted">The administrator can add switchboard reference photos, water supply information and equipment videos for this house.</p>`}</div><div class="section-head"><h2>Common problems</h2></div><div class="guide-grid">${availableGuides().slice(0,4).map(guideButton).join('')}</div><div class="section-head"><h2>Safety comes first</h2></div>${urgentBox()}` }
function guideButton(g){return `<button class="listrow" onclick="startGuide('${g.id}')"><span style="display:flex;gap:12px;align-items:center"><span class="checkbox-bubble" style="font-size:20px">${g.icon}</span><span><strong>${safe(g.name)}</strong><p>${safe(g.subtitle)}${g.scope&&g.scope!=='all'?' • House-specific':''}</p></span></span><span style="font-size:20px;color:var(--green)">›</span></button>`}
function urgentBox(){const h=houseRec(s.house)||{},num=(h.emergency_contact_number||'').replace(/[^+0-9]/g,'');return `<div class="callout"><span style="font-size:23px">🚨</span><div><strong>${safe(t('emergency'))}</strong><p>${safe(t('emergencySub'))} ${num?`Property emergency contact: <a href="tel:${safe(num)}"><strong>${safe(h.emergency_contact_name||'Maintenance')} — ${safe(h.emergency_contact_number)}</strong></a>`:'<b>No property emergency contact has been configured.</b>'}</p></div></div>`}
function fix(){let gs=availableGuides();return `<section class="hero"><div><div class="eyebrow">House-specific knowledge library</div><h1>${safe(t('next'))}</h1><p>Choose a guide to see photos, videos and safe step-by-step instructions for your property.</p></div><div class="hero-icon">🔧</div></section>${localizeNotice()}<form class="searchbar" onsubmit="lookup(event)"><span style="font-size:21px">⌕</span><input id="issue-search" aria-label="Search issue" placeholder="${safe(t('search'))}" value="${safe(searchTerm)}"/><button type="submit" class="primary">${safe(t('go'))}</button></form>${noMatch?`<div class="notice"><strong>No matching guide found.</strong> No AI answer was invented. The production version will search approved house-specific documents before offering a ticket.</div><button class="secondary" onclick="openTicket(null)">Report “${safe(searchTerm)}”</button>`:''}<div class="section-head"><h2>Available guides</h2><small>${gs.length} guides for this home</small></div><div class="guide-grid">${gs.map(guideButton).join('')}</div><div style="margin-top:22px">${urgentBox()}</div><p class="small muted" style="margin-top:14px">Default troubleshooting content is demonstration material; all instructions and translations need formal approval before real use. ChatGPT is not connected.</p>`}
function currentGuide(){return availableGuides().find(g=>g.id===guideId)}
function guide(){const g=currentGuide();if(!g)return fix();const raw=g.steps[stepId]||g.steps.start;const ov=s.guideOverrides?.[g.id]?.[stepId]||{};const st={...raw,q:ov.q||raw.q,note:ov.note??raw.note};let count=Math.max(1,Math.min(5,history.length+1));return `<button class="smallbtn" onclick="go('fix')">← ${safe(t('back'))}</button><div class="guidehead"><div class="checkbox-bubble" style="font-size:25px;width:50px;height:50px">${g.icon}</div><div><h1>${safe(g.name)}</h1><p>${safe(houseName(s.house))} • Guide revision: ${safe(g.revision||'sample')}</p></div></div>${localizeNotice()}<div class="progress">${Array.from({length:5},(_,i)=>`<span class="${i<count?'done':''}"></span>`).join('')}</div><div class="panel"><span class="tag ${st.end==='urgent'?'red':''}">${st.end==='urgent'?'STOP — urgent':st.end==='resolved'?'Completed':st.end==='ticket'?'Escalation':'Step '+count}</span><h2 class="question">${safe(st.q)}</h2><p class="muted">${safe(st.note)}</p>${mediaGallery('guide:'+g.id+':'+stepId)}${st.options?`<div style="margin-top:17px">${st.options.map(([label,next])=>`<button class="answer" onclick="answer('${next}',decodeURIComponent('${encodeURIComponent(label)}'))"><span>${safe(label)}</span><span>→</span></button>`).join('')}</div>`:''}${st.end==='resolved'?`<div class="actions"><button class="primary" onclick="markResolved()">✓ ${safe(t('resolved'))}</button><button class="secondary" onclick="openTicket('${g.id}')">It happened again / report</button></div>`:''}${st.end==='ticket'?`<div class="actions"><button class="primary" onclick="openTicket('${g.id}')">${safe(t('ticket'))} →</button></div>`:''}${st.end==='urgent'?`<div class="callout" style="margin-top:20px"><div><strong>Do not wait for a ticket.</strong><p>Call 000 for immediate danger, then contact the approved property emergency number. A ticket does not send an emergency alert.</p></div></div><div class="actions"><button class="secondary" onclick="openTicket('${g.id}')">Record issue after contacting help</button></div>`:''}</div>${history.length?`<div class="section-head"><h2>Checks already completed</h2></div><div class="panel">${history.map((h,i)=>`<p class="small"><b>${i+1}.</b> ${safe(h.q)} <strong>— ${safe(h.answer)}</strong></p>`).join('')}</div>`:''}<div class="actions"><button class="secondary" onclick="go('fix')">Other problems</button>${!st.end?`<button class="dangerbtn" onclick="openTicket('${g.id}')">${safe(t('notFixed'))} → Ticket</button>`:''}</div>`}
function care(){const residentTasks=availableTasks().filter(x=>x.who==='resident');return `<section class="hero"><div><div class="eyebrow">House & yard upkeep</div><h1>Little checks. Fewer problems.</h1><p>Regular tasks with photo and video examples, where available.</p></div><div class="hero-icon">🌱</div></section>${localizeNotice()}<div class="notice"><strong>Responsibilities:</strong> These sample tasks do not establish employment or tenancy responsibilities. No roof work, electrical repairs or untrained machinery use.</div><div class="section-head"><h2>Routine care checklist</h2><small>${residentTasks.filter(x=>s.care[s.house+'_'+x.id]).length} of ${residentTasks.length} recorded</small></div><div class="panel" style="padding:5px 20px">${residentTasks.map(x=>routineItem(x)).join('')}</div><div class="section-head"><h2>Need help?</h2></div><button class="secondary" onclick="go('fix')">Open troubleshooting guides →</button>`}
function routineItem(x){let last=s.care[s.house+'_'+x.id],due=last?Math.max(0,x.freq-daysAgo(last)):null;return `<div class="routine ${last?'done':''}"><div class="check">${last?'✓':x.icon}</div><div style="flex:1;min-width:0"><h3>${safe(x.name)}</h3><p>${safe(x.desc)}</p><div class="meta">Every ${x.freq} days • ${last?'Last completed '+when(last)+' • '+(due?'Next in '+due+' days':'Due now'):t('open')}</div>${mediaGallery('task:'+x.id)}</div><button class="secondary" onclick="markCare('${x.id}')">${last?'↻ Again':t('mark')}</button></div>`}
function tickets(){let own=s.tickets.filter(x=>x.house===s.house).sort((a,b)=>b.created.localeCompare(a.created));return `<section class="hero"><div><div class="eyebrow">${safe(houseName(s.house))}</div><h1>Your maintenance requests</h1><p>Keep track of issues in one place. The live system will sync them to the maintenance dashboard.</p></div><div class="hero-icon">🎫</div></section><div class="section-head"><h2>Requests (${own.length})</h2><button class="primary" onclick="openTicket(null)">+ New request</button></div>${own.length?own.map(ticketCard).join(''):`<div class="empty"><div class="large">📭</div><h3>No requests yet</h3><p class="muted">Once a demo request is saved it appears here.</p><button class="secondary" onclick="go('fix')">Find help first →</button></div>`}<div class="notice">This prototype saves requests in this browser only. It does <strong>not</strong> notify a maintenance worker or sync between phones.</div>`}
function ticketCard(x,tech=false){return `<article class="ticket"><div class="row"><span class="tag ${x.priority==='Urgent'?'red':'grey'}">${safe(x.priority)}</span><span class="tag ${x.status==='Resolved'?'':x.status==='In progress'?'orange':'grey'}">${safe(x.status)}</span></div><h3>${safe(x.title)}</h3><p>🏡 ${safe(houseName(x.house))} • #${safe(x.id)} • ${when(x.created)}</p><p>${safe(x.details)}</p>${x.checks?.length?`<details><summary class="small" style="cursor:pointer;color:var(--green)">Checks already completed (${x.checks.length})</summary><div class="small muted">${x.checks.map(k=>`<p>• ${safe(k.q)} — ${safe(k.answer)}</p>`).join('')}</div></details>`:''}${mediaGallery('ticket:'+x.id)}${tech?`<div class="field" style="margin-top:10px"><label>Update status</label><select onchange="setStatus('${x.id}',this.value)">${['New','In progress','Waiting for parts','Resolved'].map(o=>`<option ${x.status===o?'selected':''}>${o}</option>`).join('')}</select></div>`:''}</article>`}
function ticketForm(){return `<button class="smallbtn" onclick="go('tickets')">← ${safe(t('back'))}</button><div class="guidehead"><div class="checkbox-bubble" style="font-size:23px">🎫</div><div><h1>Maintenance request</h1><p>${safe(houseName(s.house))} • Local demonstration</p></div></div><div class="notice">No ticket is sent to the maintenance team in this prototype. For emergencies, phone your designated contact immediately.</div><form class="panel" onsubmit="submitTicket(event)"><div class="field"><label>Property</label><input readonly value="${safe(houseName(s.house))}"/></div><div class="field"><label>Problem / title</label><input id="ticket-title" required maxlength="100" value="${safe(draft.title||'')}" placeholder="e.g. Hot water not working"/></div><div class="field"><label>${safe(t('details'))}</label><textarea id="ticket-details" required maxlength="2000">${safe(draft.details||'')}</textarea></div><div class="field"><label>Priority</label><select id="ticket-priority"><option>Routine</option><option>Urgent</option></select></div><div class="field"><label>Evidence photos or videos (optional)</label><input id="ticket-photo" type="file" multiple accept="image/*,video/*"/><div class="filehint">Saved to this device after the request is created. Video may use significant storage.</div></div>${draft.checks?.length?`<div class="info">${draft.checks.length} troubleshooting checks will be attached.</div>`:''}<div class="actions"><button class="primary" type="submit">Save local demo request →</button></div></form>`}
function tech(){const all=s.tickets.slice().sort((a,b)=>b.created.localeCompare(a.created));const open=all.filter(x=>x.status!=='Resolved');const urgent=open.filter(x=>x.priority==='Urgent');return `<section class="hero"><div><div class="eyebrow">Staff demo view • all 30 homes</div><h1>Maintenance dashboard</h1><p>Review, prioritise and update requests across properties. Live access must be protected by employee roles and authentication.</p></div><div class="hero-icon">🛠️</div></section><div class="notice">This is a demonstration only: staff mode is not access-controlled and requests exist only in this browser. A production technician dashboard requires real authentication and shared storage.</div><div class="section-head"><h2>Workload</h2></div><div class="metricrow"><div class="metric"><strong>${open.length}</strong><span>Open jobs</span></div><div class="metric"><strong>${urgent.length}</strong><span>Urgent jobs</span></div><div class="metric"><strong>${new Set(open.map(x=>x.house)).size}</strong><span>Houses with jobs</span></div></div><div class="section-head"><h2>Maintenance queue</h2><select aria-label="Filter tickets" id="tech-filter" onchange="filterTech(this.value)" style="border:1px solid var(--line);padding:9px;border-radius:10px"><option value="all">All statuses</option><option value="open">Open only</option><option value="urgent">Urgent only</option></select></div><div id="tech-list">${all.length?all.map(x=>ticketCard(x,true)).join(''):`<div class="empty"><p>No demo tickets yet. Switch to employee mode and create one to see the workflow.</p></div>`}</div><div class="section-head"><h2>Team-scheduled maintenance</h2></div><div class="panel" style="padding:5px 20px">${availableTasks().filter(x=>x.who==='tech').map(routineItem).join('')}</div>`}
function render(){document.documentElement.lang=s.language==='fil'?'fil':s.language==='ceb'?'ceb':'en';let body=!s.house?gate():`<div class="shell">${nav()}${s.view==='home'?home():s.view==='fix'?fix():s.view==='guide'?guide():s.view==='care'?care():s.view==='tickets'?tickets():s.view==='ticketnew'?ticketForm():s.view==='tech'?tech():s.view==='properties'?propertiesPage():s.view==='propertyEdit'?propertyEditor():s.view==='library'?libraryPage():s.view==='guideEdit'?guideEditor():s.view==='routinesAdmin'?routineAdmin():home()}<div class="footnote">PROPERTY CARE • V2 interactive prototype • No shared cloud data, notifications or live AI</div></div>${['ticketnew','guide','propertyEdit','guideEdit'].includes(s.view)?'':`<div class="mobile-nav">${btnNav()}</div>`}`;document.getElementById('app').innerHTML=header()+body;hydrateMedia()}
window.setup=()=>{const id=document.getElementById('house-picker').value;if(!id){alert('Please select a demo property.');return} s.house=id;pendingHouse='';s.role='resident';s.view='home';save();render()};
window.setLang=v=>{const picker=document.getElementById('house-picker');if(picker)pendingHouse=picker.value;s.language=v;save();render()};
window.changeHouse=()=>{s.house='';s.role='resident';s.view='home';save();render()};
window.go=view=>{s.view=view;save();render()};
window.toggleRole=()=>{s.role=s.role==='tech'?'resident':'tech';s.view=s.role==='tech'?'properties':'home';save();render()};
window.startGuide=id=>{guideId=id;stepId='start';history=[];s.view='guide';save();render()};
window.answer=(next,label)=>{const g=currentGuide();const step=g.steps[stepId];history.push({q:step.q,answer:label});stepId=next;render()};
window.lookup=e=>{e.preventDefault();searchTerm=document.getElementById('issue-search').value.trim();if(!searchTerm)return;let q=searchTerm.toLowerCase(),g=availableGuides().find(x=>(x.keywords||[]).some(w=>q.includes(w))||x.name.toLowerCase().includes(q)||x.subtitle?.toLowerCase().includes(q));if(g){noMatch=false;startGuide(g.id)}else{noMatch=true;render()}};

function adminWarning(){return `<div class="notice"><b>Local demonstration:</b> staff mode has no sign-in or role protection, and any media or records added are only on this browser. No employee or maintainer on another device will see them. Do not use this prototype for real maintenance reporting.</div>`}

function propertiesPage(){return `${adminTabs()}<section class="hero"><div><div class="eyebrow">Property register</div><h1>30 homes, individual instructions.</h1><p>Add real addresses, equipment, emergency contacts and house-specific photos or videos.</p></div><div class="hero-icon">🏡</div></section>${adminWarning()}<div class="section-head"><h2>Properties (${houses.length})</h2><button class="secondary" onclick="addProperty()">+ Add property</button></div><div class="toolbar"><input type="search" aria-label="Search property" placeholder="Search address, house ID or site…" oninput="filterHouses(this.value)"/><button class="secondary" onclick="exportProperties()">↓ Download CSV</button><label class="secondary" style="cursor:pointer">↑ Import CSV <input type="file" accept=".csv,text/csv" style="display:none" onchange="importProperties(event)"/></label></div><p class="small muted">Import uses the provided property_id to update house records without changing the house IDs. Review the CSV before uploading.</p><div id="property-list">${houses.map(propertyListItem).join('')}</div>`}

const propFields=[['address','Address'],['site','Site / farm'],['water_supply','Water supply (town/tank/bore/pump)'],['power_supplier','Electricity network / supplier'],['hot_water_type','Hot water system'],['aircon_model','Air-conditioning model'],['emergency_contact_name','Emergency contact name'],['emergency_contact_number','Emergency contact phone']];
function propertyEditor(){let h=houseRec(s.editHouse);if(!h)return propertiesPage();let eq=s.equipment.filter(x=>x.propertyId===h.id);return `${adminTabs()}<button class="smallbtn" onclick="go('properties')">← Back to properties</button><div class="section-head"><h2>${safe(houseName(h.id))}</h2><span class="tag">${safe(h.id)}</span></div>${adminWarning()}<form class="panel" onsubmit="saveProperty(event)"><h3 style="margin-top:0">Property profile</h3><div class="split">${propFields.map(([k,label])=>`<div class="field"><label>${label}</label><input name="${k}" value="${safe(h[k]||'')}" ${k==='emergency_contact_number'?'type="tel"':''}/></div>`).join('')}</div><div class="field"><label>House-specific instructions / access notes (no passwords or keys)</label><textarea name="approved_guide_notes">${safe(h.approved_guide_notes||'')}</textarea></div><button class="primary" type="submit">Save property details</button></form><div class="section-head"><h2>House reference photos & videos</h2></div><div class="panel"><p class="muted small">Upload identifying photos of labelled switches, water tanks, approved shut-off locations, or narrated video walkthroughs. Do not publish lock codes, passwords or sensitive personal details.</p>${mediaGallery('property:'+h.id,true)}</div><div class="section-head"><h2>Equipment (${eq.length})</h2></div>${eq.map(x=>`<div class="panel" style="margin-bottom:14px"><div class="row"><strong>${safe(x.name)}</strong><button class="dangerbtn" onclick="removeEquipment('${x.id}')">Remove</button></div><p class="small muted">${safe(x.location||'Location not set')} • ${safe(x.model||'Model not set')}</p><p>${safe(x.notes||'')}</p><strong class="small">Equipment photo / demonstration video</strong>${mediaGallery('equipment:'+x.id,true)}</div>`).join('')}<form class="panel" onsubmit="addEquipment(event)"><h3 style="margin-top:0">+ Add equipment</h3><div class="split"><div class="field"><label>Equipment name</label><input required name="name" maxlength="100" placeholder="e.g. Water pump / switchboard"/></div><div class="field"><label>Location</label><input name="location" maxlength="160" placeholder="e.g. Tank shed exterior"/></div><div class="field"><label>Make / model</label><input name="model" maxlength="120"/></div></div><div class="field"><label>Approved reference notes</label><textarea name="notes" maxlength="2000" placeholder="Where to identify equipment and which actions are allowed"></textarea></div><button class="primary" type="submit">Add equipment</button></form><div class="actions"><button class="secondary" onclick="go('library')">Create a house-specific guide →</button></div>`}

const csvHeaders=['property_id','address','site','emergency_contact_name','emergency_contact_number','water_supply','power_supplier','hot_water_type','aircon_model','approved_guide_notes'];
function csvEscape(v){let str=String(v??'');return /[",\r\n]/.test(str)?'"'+str.replaceAll('"','""')+'"':str}
window.exportProperties=()=>{let rows=[csvHeaders.join(','),...houses.map(h=>csvHeaders.map(k=>csvEscape(k==='property_id'?h.id:h[k]||'')).join(','))];downloadBlob(new Blob(['\ufeff'+rows.join('\r\n')],{type:'text/csv;charset=utf-8'}),'property-care-houses.csv')};
function parseCSV(text){let rows=[],row=[],cur='',quote=false;for(let i=0;i<text.length;i++){let c=text[i];if(quote){if(c==='"'&&text[i+1]==='"'){cur+='"';i++}else if(c==='"')quote=false;else cur+=c}else if(c==='"')quote=true;else if(c===','){row.push(cur);cur=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cur);if(row.some(v=>v.trim()))rows.push(row);row=[];cur=''}else cur+=c}row.push(cur);if(row.some(v=>v.trim()))rows.push(row);return rows}
window.importProperties=async e=>{let file=e.target.files[0];if(!file)return;let rows=parseCSV((await file.text()).replace(/^\ufeff/,''));if(!rows.length){alert('CSV empty');return}let hdr=rows.shift().map(x=>x.trim().toLowerCase());let idIndex=hdr.indexOf('property_id');if(idIndex<0){alert('CSV needs property_id header.');return}let ids=rows.map(r=>(r[idIndex]||'').trim());if(new Set(ids).size!==ids.length||ids.some(id=>!houseRec(id))){alert('Each property_id must uniquely match an existing house. No changes made.');return}if(!confirm('Update '+rows.length+' property records from this CSV? All other records will stay unchanged.'))return;for(const row of rows){let h=houseRec(row[idIndex].trim());for(const key of csvHeaders.slice(1)){let i=hdr.indexOf(key);if(i>=0)h[key]=String(row[i]||'').trim()}}save();render();alert('Imported '+rows.length+' properties to this browser.')};
function downloadBlob(blob,filename){let a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}
function libraryPage(){let guides=[...guideData.map(g=>({...g,isSample:true})),...s.customGuides];return `${adminTabs()}<section class="hero"><div><div class="eyebrow">Knowledge compendium</div><h1>Guides employees can see.</h1><p>Upload step-by-step images and videos, keep instructions property-specific, and publish only reviewed guides.</p></div><div class="hero-icon">🎞️</div></section>${adminWarning()}<div class="section-head"><h2>Guide library (${guides.length})</h2><button class="primary" onclick="createGuide()">+ Create guide</button></div><div class="stack">${guides.map(g=>`<div class="prop-row"><div><strong>${safe(g.icon)} ${safe(g.name)}</strong> <span class="tag ${g.isSample||!g.approved?'orange':''}">${g.isSample?'Demonstration':' '+(g.approved?'Published':'Draft')}</span><small>${safe(g.scope&&g.scope!=='all'?houseName(g.scope):'All houses')} · ${Object.keys(g.steps).length} guide stages${g.isSample?' · sample safety wording':''}</small></div><button class="secondary" onclick="editGuide('${g.id}')">Edit guide →</button></div>`).join('')}</div><div class="gallery-banner"><strong>Where media appears:</strong> Add a photo to the first question of the power guide, a video showing how to read the tank level, or a short clip for an air-conditioner filter check. Employees will see that media inside the appropriate guide step.</div>`}
function makeSteps(instructions){let steps={};instructions.forEach((x,i)=>{let id=i?'step'+i:'start';let next=i===instructions.length-1?'ticket':(i===0?'step1':'step'+(i+1));steps[id]={q:x.q,note:x.note,options:[['Problem fixed','resolved'],['Continue',next],['Need maintenance help','ticket'],['Unsafe / urgent','urgent']]}});steps.ticket={q:'Maintenance assistance is needed.',note:'Submit a request once any urgent safety concern has been addressed. For emergencies, call the designated property contact.',end:'ticket'};steps.resolved={q:'Problem appears resolved.',note:'If it happens again, request maintenance.',end:'resolved'};steps.urgent={q:'Stop if unsafe.',note:'Move away from hazards and contact the emergency service or site contact as appropriate. Do not wait for an app ticket.',end:'urgent'};return steps}
window.createGuide=()=>{let id=newId('guide');s.customGuides.push({id,name:'New guide',subtitle:'Describe the purpose of this guide',icon:'📘',scope:'all',category:'Troubleshooting',keywords:[],approved:false,approvedBy:'',revision:'1',steps:makeSteps([{q:'What should you check safely?',note:'Describe safe observations and include any warning conditions.'}])});save();editGuide(id)};

function guideEditor(){const raw=guideData.find(g=>g.id===s.editGuide)||s.customGuides.find(g=>g.id===s.editGuide);if(!raw)return libraryPage();const builtin=guideData.some(g=>g.id===raw.id);return `${adminTabs()}<button class="smallbtn" onclick="go('library')">← Guide library</button><div class="section-head"><h2>${safe(raw.name)}</h2><span class="tag ${builtin||!raw.approved?'orange':''}">${builtin?'Sample guide':raw.approved?'Published':'Draft'}</span></div>${adminWarning()}${builtin?`<div class="info">This is a sample branching troubleshooting guide. You can edit the text shown for each step and attach photos/videos to every stage. Review safety advice before live use.</div>`:`<form class="panel" onsubmit="saveGuideInfo(event)"><h3 style="margin-top:0">Guide details</h3><div class="split"><div class="field"><label>Title</label><input name="name" required maxlength="100" value="${safe(raw.name)}"/></div><div class="field"><label>Subtitle</label><input name="subtitle" maxlength="150" value="${safe(raw.subtitle)}"/></div><div class="field"><label>Shown to</label><select name="scope"><option value="all">All houses</option>${houses.map(h=>`<option value="${h.id}" ${raw.scope===h.id?'selected':''}>${safe(houseName(h.id))}</option>`).join('')}</select></div><div class="field"><label>Search keywords (comma separated)</label><input name="keywords" value="${safe((raw.keywords||[]).join(', '))}"/></div><div class="field"><label>Revision number</label><input name="revision" maxlength="20" value="${safe(raw.revision||'1')}"/></div><div class="field"><label>Reviewed by (name)</label><input name="approvedBy" maxlength="100" value="${safe(raw.approvedBy||'')}" placeholder="Required to publish"/></div></div><label class="field"><span><input type="checkbox" name="approved" ${raw.approved?'checked':''}/> Publish after safety and translation review</span></label><button class="primary" type="submit">Save guide & publication status</button></form>`}<div class="section-head"><h2>Step-by-step instructions & media</h2></div><p class="small muted">Images and videos are displayed beside the exact troubleshooting step selected by employees. Attach photos of equipment and short clips; add captions or transcripts for accessibility and future translation.</p>${Object.entries(raw.steps).map(([id,st])=>{const ov=s.guideOverrides?.[raw.id]?.[id]||{};return `<div class="panel" style="margin-bottom:14px"><div class="row"><h3 style="margin:0">${safe(id==='start'?'Step 1':id)}</h3><span class="tag ${st.end==='urgent'?'red':''}">${safe(st.end||'Question')}</span></div><form onsubmit="saveGuideStep(event,'${raw.id}','${id}')"><div class="field"><label>Question / heading</label><textarea required name="q" style="min-height:55px">${safe(ov.q||st.q)}</textarea></div><div class="field"><label>Safe instructions / explanation</label><textarea name="note" style="min-height:70px">${safe(ov.note??st.note??'')}</textarea></div><button class="secondary" type="submit">Save this step</button></form><h4 style="margin-bottom:0">Photos and videos for this step</h4>${mediaGallery('guide:'+raw.id+':'+id,true)}</div>`}).join('')}${!builtin?`<div class="actions"><button class="secondary" onclick="addGuideStep('${raw.id}')">+ Add another safe step</button><button class="dangerbtn" onclick="deleteGuide('${raw.id}')">Delete this guide</button></div>`:''}`}
window.saveGuideInfo=e=>{e.preventDefault();let g=s.customGuides.find(x=>x.id===s.editGuide);if(!g)return;let f=new FormData(e.target);let who=String(f.get('approvedBy')||'').trim(),pub=!!f.get('approved');if(pub&&!who){alert('Enter the name of the person who reviewed the guide before publishing.');return}Object.assign(g,{name:String(f.get('name')||'').trim(),subtitle:String(f.get('subtitle')||'').trim(),scope:String(f.get('scope')||'all'),keywords:String(f.get('keywords')||'').split(',').map(x=>x.trim().toLowerCase()).filter(Boolean),revision:String(f.get('revision')||'1').trim(),approvedBy:who,approved:pub});save();render();alert(pub?'Guide published in the local demo.':'Draft saved locally.')};
window.saveGuideStep=(e,gid,step)=>{e.preventDefault();let f=new FormData(e.target);let q=String(f.get('q')||'').trim(),note=String(f.get('note')||'').trim();if(!q){alert('Add a heading');return}if(!s.guideOverrides[gid])s.guideOverrides[gid]={};s.guideOverrides[gid][step]={q,note};const g=s.customGuides.find(x=>x.id===gid);if(g)g.approved=false;save();render();alert('Step saved. If this was a custom guide, it is now a draft until reviewed again.')};
window.addGuideStep=id=>{let g=s.customGuides.find(g=>g.id===id);if(!g)return;let items=Object.entries(g.steps).filter(([key,st])=>!st.end).map(([key,st])=>({q:s.guideOverrides[id]?.[key]?.q||st.q,note:s.guideOverrides[id]?.[key]?.note??st.note}));items.push({q:'Describe the next safe check',note:'Use plain language. Add a photo or video after saving.'});g.steps=makeSteps(items);g.approved=false;save();render()};
window.deleteGuide=id=>{if(!confirm('Delete this custom guide? Any linked photos/videos remain in local storage until removed.'))return;s.customGuides=s.customGuides.filter(x=>x.id!==id);save();go('library')};
function routineAdmin(){let all=[...tasks.map(x=>({...x,builtin:true})),...s.extraTasks];return `${adminTabs()}<section class="hero"><div><div class="eyebrow">Preventative maintenance library</div><h1>Show how every check is done.</h1><p>Add photos or videos to routine tasks, including employee checks and technician-only jobs.</p></div><div class="hero-icon">🌱</div></section>${adminWarning()}<div class="section-head"><h2>Routine checklist content</h2><small>${all.length} tasks</small></div>${all.map(x=>`<div class="panel" style="margin-bottom:12px"><div class="row"><strong>${safe(x.icon)} ${safe(x.name)}</strong><span class="tag">${x.who==='tech'?'Maintenance team':'Resident'} • ${x.freq} days</span></div><p class="muted small">${safe(x.desc)} ${x.propertyId?' • '+safe(houseName(x.propertyId)):''}</p>${mediaGallery('task:'+x.id,true)}${!x.builtin?`<div class="actions"><button class="dangerbtn" onclick="removeTask('${x.id}')">Delete custom task</button></div>`:''}</div>`).join('')}<form class="panel" onsubmit="addRoutine(event)"><h3>+ New recurring task</h3><div class="split"><div class="field"><label>Task name</label><input name="name" maxlength="120" required placeholder="e.g. Check outdoor taps for leaks"/></div><div class="field"><label>Repeat every (days)</label><input type="number" name="freq" min="1" max="730" value="30" required/></div><div class="field"><label>Responsible person</label><select name="who"><option value="resident">Resident</option><option value="tech">Maintenance team</option></select></div><div class="field"><label>Applies to</label><select name="propertyId"><option value="">All houses</option>${houses.map(h=>`<option value="${h.id}">${safe(houseName(h.id))}</option>`).join('')}</select></div></div><div class="field"><label>Safe instructions</label><textarea required name="desc"></textarea></div><button class="primary" type="submit">Add recurring task</button></form>`}

function newId(prefix){return prefix+'_'+(globalThis.crypto?.randomUUID?.()||Math.random().toString(36).slice(2)).replaceAll('-','').slice(0,20)}
// IndexedDB holds actual media blobs; localStorage contains only link metadata and texts.
let mediaDBPromise=null;const objectUrls=new Map();
function mediaDB(){if(!('indexedDB' in window))return Promise.reject(new Error('Local media storage not available in this browser'));if(!mediaDBPromise)mediaDBPromise=new Promise((resolve,reject)=>{let req=indexedDB.open('PropertyCareMediaV2',1);req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains('files'))req.result.createObjectStore('files',{keyPath:'id'})};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error||new Error('Cannot open local media database'))});return mediaDBPromise}
async function blobPut(id,blob){let db=await mediaDB();return new Promise((resolve,reject)=>{let tx=db.transaction('files','readwrite');tx.objectStore('files').put({id,blob});tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error||new Error('Media storage failed'))})}
async function blobGet(id){let db=await mediaDB();return new Promise((resolve,reject)=>{let tx=db.transaction('files','readonly'),req=tx.objectStore('files').get(id);req.onsuccess=()=>resolve(req.result?.blob);req.onerror=()=>reject(req.error)})}
async function blobDelete(id){let db=await mediaDB();return new Promise((resolve,reject)=>{let tx=db.transaction('files','readwrite');tx.objectStore('files').delete(id);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}
async function storeFiles(files,key){const batch=[];try{for(const file of files){const type=file.type||'';if(!type.startsWith('image/')&&!type.startsWith('video/'))throw new Error('Only image or video files are supported: '+file.name);if(type.includes('svg')||type.includes('html'))throw new Error('SVG and HTML media are not supported.');if(file.size>100*1024*1024)throw new Error('Each file must be 100 MB or smaller: '+file.name);if(!file.size)throw new Error('Empty file: '+file.name);const id=newId('media');await blobPut(id,file);batch.push({id,name:file.name,mime:type||(/\.(mp4|webm|mov)$/i.test(file.name)?'video/mp4':'image/jpeg'),size:file.size,caption:'',transcript:'',added:new Date().toISOString()})}if(!s.mediaMap[key])s.mediaMap[key]=[];for(const asset of batch){s.mediaMeta[asset.id]=asset;s.mediaMap[key].push(asset.id)}save();return true}catch(err){for(const b of batch){try{await blobDelete(b.id)}catch{}}alert('Unable to save media: '+(err?.message||String(err))+'. Try a smaller file or a different browser.');return false}}
window.attachMedia=async(e,key)=>{const files=[...(e.target.files||[])];if(!files.length)return;e.target.disabled=true;const ok=await storeFiles(files,key);if(ok)render();else e.target.disabled=false};
window.removeMedia=async(key,id)=>{if(!confirm('Remove this photo/video from this section?'))return;s.mediaMap[key]=(s.mediaMap[key]||[]).filter(x=>x!==id);let linked=Object.values(s.mediaMap).some(ids=>ids.includes(id));if(!linked){delete s.mediaMeta[id];try{await blobDelete(id)}catch{}}const url=objectUrls.get(id);if(url){URL.revokeObjectURL(url);objectUrls.delete(id)}save();render()};
window.saveMediaText=(e,id)=>{e.preventDefault();let m=s.mediaMeta[id];if(!m)return;let f=new FormData(e.target);m.caption=String(f.get('caption')||'').slice(0,250);m.transcript=String(f.get('transcript')||'').slice(0,8000);save();render()};
function mediaGallery(key,edit=false){let ids=(s.mediaMap[key]||[]).filter(id=>s.mediaMeta[id]);return `${ids.length?`<div class="media-grid">${ids.map(id=>{const m=s.mediaMeta[id];return `<div class="media-item"><div data-media-id="${id}" data-media-kind="${m.mime.startsWith('video/')?'video':'image'}"><div style="height:145px;display:grid;place-items:center;color:var(--muted)">Loading media…</div></div><div class="media-body"><strong>${safe(m.name)}</strong>${m.caption?`<p>${safe(m.caption)}</p>`:''}${m.transcript?`<details><summary>Instructions / video transcript</summary><p>${safe(m.transcript)}</p></details>`:''}${edit?`<details><summary>Edit caption & transcript</summary><form onsubmit="saveMediaText(event,'${id}')"><div class="field"><label>Caption / description</label><input name="caption" maxlength="250" value="${safe(m.caption||'')}" placeholder="e.g. Water tank level gauge"/></div><div class="field"><label>Video transcript / written instructions</label><textarea name="transcript" maxlength="8000">${safe(m.transcript||'')}</textarea></div><button class="secondary" type="submit">Save text</button></form></details><button class="dangerbtn" style="margin-top:9px" onclick="removeMedia('${key}','${id}')">Remove media</button>`:''}</div></div>`}).join('')}</div>`:edit?`<p class="small muted">No media added yet.</p>`:''}${edit?`<div class="media-note"><strong>📷 Add photos or videos</strong><p class="small muted">Choose multiple JPG, PNG, HEIC (if browser supports), MP4, MOV or WebM files. Up to 100 MB per file. Add captions or written transcripts after uploading. Playback depends on the browser.</p><input type="file" aria-label="Upload photos or videos" multiple accept="image/*,video/*" onchange="attachMedia(event,'${key}')"/></div>`:''}`}
async function hydrateMedia(){const items=[...document.querySelectorAll('[data-media-id]')];for(const el of items){const id=el.dataset.mediaId,m=s.mediaMeta[id];if(!m)continue;try{let url=objectUrls.get(id);if(!url){const blob=await blobGet(id);if(!blob)throw new Error('Media missing from browser storage');url=URL.createObjectURL(blob);objectUrls.set(id,url)}if(!el.isConnected)continue;const node=document.createElement(m.mime.startsWith('video/')?'video':'img');node.src=url;if(node.tagName==='VIDEO'){node.controls=true;node.preload='metadata';node.playsInline=true;node.setAttribute('aria-label',m.caption||m.name)}else{node.alt=m.caption||m.name;node.loading='lazy'}el.replaceChildren(node)}catch(err){if(el.isConnected)el.textContent='Media unavailable on this device.'}}}

render();
</script>
